services:
  postgres:
    container_name: postgres
    hostname: postgres
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=lab1
      - POSTGRES_USER=lab1
      - POSTGRES_PASSWORD=postgres
      - PGPORT=5433
      - POSTGRES_SSL_MODE=disable
      - PGDATA=/data/postgres
    ports:
      - 5433:5433
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab1"]
      interval: 5s
      timeout: 5s
      retries: 10
