version: v1

# Список зависимостей proto-модулей (если необходимости нет — оставьте пустым)
deps: []

build:
  excludes: []

lint:
  use:
    - DEFAULT
  except: []
  ignore: []
  ignore_only: {}
  allow_comment_ignores: false
  enum_zero_value_suffix: UNSPECIFIED
  rpc_allow_same_request_response: false
  rpc_allow_google_protobuf_empty_requests: false
  rpc_allow_google_protobuf_empty_responses: false
  service_suffix: Service

breaking:
  use: []
  except: []
  ignore: []
  ignore_only: {}
  ignore_unstable_packages: false

generate:
  # Где искать ваши .proto-файлы
  inputs:
    # локальная директория с протами
    - directory: "api/proto"
  plugins:
    - name: go
      out: pkg
      opts:
        paths: source_relative

    - name: go-grpc
      out: pkg
      opts:
        paths: source_relative
        require_unimplemented_servers: false

    - name: grpc-gateway
      out: pkg
      opts:
        paths: source_relative
